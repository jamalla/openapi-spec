<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenAPI Contract Certification</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; }
      table { border-collapse: collapse; width: 100%; margin-top: 12px; }
      td, th { border: 1px solid #ddd; padding: 8px; }
      .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
      .pill { display: inline-block; border-radius: 12px; padding: 2px 8px; border: 1px solid #333; }
    </style>
  </head>
  <body>
    <h1>OpenAPI Contract Certification Dashboard</h1>
    <div class="row">
      <input id="label" placeholder="Run label" />
      <label><input id="allowMutating" type="checkbox" /> Allow mutating endpoints</label>
      <button id="startRun">Start run</button>
      <select id="statusFilter"><option value="">All statuses</option><option>PENDING</option><option>RUNNING</option><option>SUCCEEDED</option><option>FAILED</option></select>
      <button id="refresh">Refresh</button>
    </div>

    <h2>Runs</h2>
    <table id="runsTable">
      <thead><tr><th>ID</th><th>Status</th><th>Phase</th><th>Scores</th><th>Created</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table>

    <h2>Run Details</h2>
    <div id="runDetails">Select a run.</div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
